services:
  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME}
    image: postgres:${POSTGRES_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TIMEZONE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

  shlink:
    container_name: ${SHLINK_CONTAINER_NAME}
    image: shlinkio/shlink:${SHLINK_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DEFAULT_DOMAIN: ${DDNS_ADDR}
      SHORT_DOMAIN_HOST: ${DDNS_ADDR}
      SHORT_DOMAIN_SCHEMA: http
      BASE_URL: http://${HOST_ADDR}:${SHLINK_WEB_HTTP_PORT}
      IS_HTTPS_ENABLED: "false"
      SHELL_VERBOSITY: "3"
      TZ: ${TIMEZONE}
    ports:
      - "${SHLINK_PORT}:8080"
    volumes:
      - shlink_data:/var/www/html/data
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  shlink_web:
    container_name: ${SHLINK_WEB_CONTAINER_NAME}
    image: shlinkio/shlink-web-client:${SHLINK_WEB_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      SHLINK_SERVER_URL: http://${HOST_ADDR}:${SHLINK_PORT}
      SHLINK_SERVER_API_KEY: ${SHLINK_API_KEY}
      TZ: ${TIMEZONE}
    ports:
      - "${SHLINK_WEB_HTTP_PORT}:80"
      - "${SHLINK_WEB_HTTPS_PORT}:8080"
    networks:
      - default

networks:
  default:
    name: ${SHLINK_CONTAINER_NAME}_network
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_CONTAINER_NAME}_data
    driver: local
  shlink_data:
    name: ${SHLINK_CONTAINER_NAME}_data
    driver: local