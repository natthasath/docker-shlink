version: '3.9'

services:
  shlink_db:
    image: postgres:15
    container_name: shlink_db
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - shlink_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shlink_network

  shlink:
    image: shlinkio/shlink:stable
    container_name: shlink
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      shlink_db:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DB_HOST: shlink_db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DEFAULT_DOMAIN: ${DDNS_ADDR}
      SHORT_DOMAIN_HOST: ${DDNS_ADDR}
      SHORT_DOMAIN_SCHEMA: http
      BASE_URL: http://${HOST_ADDR}:${HTTP_PORT}
      IS_HTTPS_ENABLED: "false"
      SHELL_VERBOSITY: "3"
    networks:
      - shlink_network

  shlink_web_client:
    image: shlinkio/shlink-web-client:latest
    container_name: shlink_web_client
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-8080}:8080"
    environment:
      - SHLINK_SERVER_URL=http://${HOST_ADDR}:${APP_PORT}
      - SHLINK_SERVER_API_KEY="${APP_KEY}"
    networks:
      - shlink_network

networks:
  shlink_network:
    name: shlink_network
    driver: bridge

volumes:
  shlink_db_data:
    name: shlink_db_data