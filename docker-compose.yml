services:
  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME:-shlink_db}
    image: postgres:${POSTGRES_VERSION:-15}
    restart: ${RESTART_POLICY:-always}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TIMEZONE:-Asia/Bangkok}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  shlink:
    container_name: ${SHLINK_CONTAINER_NAME:-shlink_app}
    image: shlinkio/shlink:${SHLINK_VERSION:-stable}
    restart: ${RESTART_POLICY:-always}
    environment:
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DEFAULT_DOMAIN: ${DDNS_ADDR}
      SHORT_DOMAIN_HOST: ${DDNS_ADDR}
      SHORT_DOMAIN_SCHEMA: http
      BASE_URL: http://${HOST_ADDR}:${SHLINK_WEB_HTTP_PORT}
      IS_HTTPS_ENABLED: "false"
      SHELL_VERBOSITY: "3"
      TZ: ${TIMEZONE:-Asia/Bangkok}
    ports:
      - "${SHLINK_PORT:-8080}:8080"
    volumes:
      - shlink_data:/var/www/html/data
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  shlink_web:
    container_name: ${SHLINK_WEB_CONTAINER_NAME:-shlink_web}
    image: shlinkio/shlink-web-client:${SHLINK_WEB_VERSION:-latest}
    restart: ${RESTART_POLICY:-always}
    environment:
      SHLINK_SERVER_URL: http://${HOST_ADDR}:${SHLINK_PORT}
      SHLINK_SERVER_API_KEY: ${SHLINK_API_KEY}
      TZ: ${TIMEZONE:-Asia/Bangkok}
    ports:
      - "${SHLINK_WEB_HTTP_PORT:-80}:80"
      - "${SHLINK_WEB_HTTPS_PORT:-8080}:8080"
    networks:
      - default

networks:
  default:
    name: ${NETWORK_NAME:-shlink_network}
    driver: bridge

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-shlink_postgres_data}
    driver: local
  shlink_data:
    name: ${SHLINK_VOLUME_NAME:-shlink_data}
    driver: local